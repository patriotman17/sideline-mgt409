<!-- Sideline recovery email. Shows an 8-digit code (no link), so it works on any device or email app. -->
<div style="background:#000000;padding:32px 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff">
  <div style="max-width:440px;margin:0 auto">
    <p style="margin:0 0 24px;font-size:13px;font-weight:700;letter-spacing:4px;color:#a1a1a6">SIDELINE</p>
    <h1 style="margin:0 0 12px;font-size:24px;line-height:30px;color:#ffffff">Reset your Sideline password</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:22px;color:#a1a1a6">Enter this code in the Sideline app, along with your new password:</p>
    <p style="margin:0 0 20px;padding:16px 0;background:#1c1c1e;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#ffffff">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:13px;line-height:19px;color:#6c6c70">The code expires in 1 hour and works once.</p>
    <p style="margin:0;font-size:13px;line-height:19px;color:#6c6c70">If you didn't ask to reset your password, you can ignore this email. Your password won't change.</p>
  </div>
</div>
